services:
  postgres:
    image: postgres:16-alpine
    container_name: bookbite-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookbite
    ports:
      - "5432:5432"
    volumes:
      - bookbite_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bookbite-redis
    ports:
      - "6379:6379"
    volumes:
      - bookbite_redis:/data

volumes:
  bookbite_pgdata:
  bookbite_redis:
